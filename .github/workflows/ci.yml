# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (Playwright)
        run: sudo apt-get update && sudo apt-get install -y libnss3 libatk-bridge2.0-0 libgtk-3-0

      - name: Install package
        run: |
          pip install --upgrade pip wheel
          pip install ".[dev]"        # pulls lint/test extras
          python -m playwright install --with-deps

      - name: Lint & type‑check
        run: |
          pylint docharvester_pro
          flake8 docharvester_pro
          mypy docharvester_pro

      - name: Run tests + coverage
        run: |
          pytest -q --cov=docharvester_pro \
                    --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
