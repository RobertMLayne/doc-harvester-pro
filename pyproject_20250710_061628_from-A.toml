# pyproject.toml  (PEP 621 minimal)
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docharvester-pro"
version = "0.1.0"
description = "High‑throughput documentation crawler → Markdown/PDF"
authors = [{ name = "Robert M. Layne, Ph.D.", email = "RobertMLayne@iCloud.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "markdownify>=0.11",
    "playwright>=1.44",
    "pdfkit>=1.0.0",
]

[project.scripts]
docharvester = "docharvester_pro.scrape_to_markdown:main"
chat-split    = "docharvester_pro.utils.chat_export_splitter:main"
